<!DOCTYPE html>
<html>
  <body>
    <div class="window-app notepad-app" style="position: absolute; left: 0px; top: 0px">
      <div class="window-header">
        <div class="window-title">
          <p>Generic window</p>
        </div>
        <div class="window-buttons">
          <div class="dot maxmize">
            <img src="assets/img/terminal/maximize.svg" />
          </div>
          <div class="dot close">
            <img src="assets/img/terminal/close.svg" />
          </div>
        </div>
      </div>

      <div class="window-content">
        <textarea>
At w3schools.com you will learn how to make a website. They offer free tutorials in all web development technologies.
        </textarea>
      </div>
    </div>

    <style>
      .notepad-app {
        div.window-content {
          border: 1px solid blue;
          overflow: unset;
        }
        --initial-window-height: 400px;
        --initial-window-width: 500px;

        textarea {
          box-sizing: border-box;
          width: 100%;
          height: 100%;
          resize: none;
        }
      }
    </style>
    <style>
      :root {
        --initial-window-height: 200px;
        --initial-window-width: 300px;
        --window-border-radius: 15px;
      }
      /* generic styles for window*/
      .window-app {
        height: var(--initial-window-height, 200px);
        width: var(--initial-window-width, 300px);
        border: 1px solid #d2d2d2;
        display: flex;
        flex-direction: column;
        border-radius: 15px;
        overflow: hidden;
        background-color: trasnparent;
        .window-content {
          height: 100%;
          background-color: rgba(0, 0, 0, 0.5);
          padding: 5px;
          overflow-y: auto;
        }
        .window-header {
          height: 30px;
          width: 100%;
          background-color: #2f2f2f;
          align-items: center;
          display: flex;
          flex-direction: row;
          justify-content: flex-end;
          .window-title {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            p {
              color: white;
              margin: 0;
            }
          }

          .window-buttons {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            margin-right: 4px;
            .dot {
              --size: 15px;
              width: var(--size);
              height: var(--size);
              border-radius: 50%;
              margin: 5px;
              background-color: #909090;
              display: flex;
              justify-content: center;
              align-items: center;
              img {
                width: calc(var(--size) - 4px);
                height: calc(var(--size) - 4px);
              }
            }
          }
        }
      }
    </style>
  </body>
</html>
