<!DOCTYPE html>
<html>
  <head>
    <title>Experiments</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <link rel="stylesheet" href="assets/css/main.css" />

    <!-- For maps app-->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>
  <body>
    <div id="container-html">
      <div id="desktop">
        <button onclick="increment()">INCRMENT</button>
        <button onclick="decrement()">DECREMENT</button>
      </div>
      <div id="taskbar">
        <div class="icon" onclick="openStartMenu()">
          <img src="assets/img/pencil-svgrepo-com.svg" style="height: 20px" />
        </div>
        <div class="icon" onclick="openConsole()">
          <img src="assets/img/terminal.svg" style="height: 30px" />
        </div>
        <div id="time">
          <p id="timeval"></p>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="./assets/js/startup.js"></script>
    <script type="module" src="./assets/js/start-menu.js"></script>
  </body>
</html>
